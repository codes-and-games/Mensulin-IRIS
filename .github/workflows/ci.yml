name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q
      - run: python -m iris.tools.claims_lint README.md docs/decisions/*.md experiments/*/README.md experiments/*/expected_outputs.md
      - run: python -m pip install markdown
      - run: python scripts/build_site.py
      - run: sh scripts_pipeline_test.sh        # TEST-mode plumbing only; never a result
